<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>채굴 공방 — 프로토타입</title>
</head>
<body>
<script>
function craftSpeed(){
  return 1 + Math.max(0, state.craftFacility - 1) * BALANCE.crafting.FACILITY_SPEED_PER_LEVEL;
}
function updateNumbers(){
  RECIPES.forEach(r=>{
    const craftBtn = document.querySelector(`[data-craft="${r.key}"]`);
    if(craftBtn){
      if(state.craftQueue[r.key] !== null){
        craftBtn.disabled = true;
        craftBtn.textContent = `제작 중... ${(state.craftQueue[r.key] / craftSpeed()).toFixed(1)}s`;
      }
    }
  });
}
</script>
</body>
</html>
