  content.append(el('p','가까운 광맥에서 재료를 모아 공방을 성장시키세요. 장비는 제작 즉시 장착됩니다. 괄호 안 숫자는 현재 재고입니다.'));section(content,'01 / 기술 연구');for(const [id,r]of Object.entries(G.researches)){const b=button(s.research[id]?'연구 완료':'연구',()=>game.research(id),'research-'+id);b.disabled=!!s.research[id];row(content,r.name,r.desc+' · '+costs(r.cost),b);}section(content,'02 / 장비와 소품 제작');for(const [id,r]of Object.entries(G.recipes)){const done=id!=='lantern'&&s.equipment[id],b=button(done?'제작 완료':'제작',()=>game.craft(id),'craft-'+id);b.disabled=!!done;row(content,r.name,r.desc+' · '+costs(r.cost),b);}content.append(el('p',game.notice,'hint'));
 }else if(p.type==='map'){
  content.append(el('p',s.flags.lab?'B4 연구실 복원 완료. 남은 지역의 기록과 생활을 즐겨 보세요.':'목표: B2 전력과 B3 난방을 복구하고 B4 연구실 기록을 읽으세요. 초원 남쪽에 지하 입구가 있습니다.'));const grid=el('div',undefined,'region-list');for(const r of G.regions){const n=el('div',(s.visited.includes(r.id)?'● ':'○ ')+r.name);n.append(el('small',r.action));if(s.records.includes(r.id))n.append(el('small','기록 발견 ✓'));grid.append(n);}content.append(grid);section(content,'발견한 기록');for(const id of s.records)content.append(el('p',G.regions.find(r=>r.id===id).note));content.append(el('p','지상: 초원 ↔ 이끼숲 ↔ 서리 고원 ↔ 늪지 ↔ 수정 지대 ↔ 산맥 ↔ 화산 ↔ 초원. 길 끝 표지판에서 E로 이동하세요.','hint'));
 }else if(p.type==='teleport'){content.append(el('p','직접 방문해 활성화한 장치 사이에서만 이동합니다.'));for(const id of s.teleports){const b=button(id===s.region?'현재 위치':'이동',()=>{game.travel(id);clear();},'travel-'+id);b.disabled=id===s.region;row(content,G.regions.find(r=>r.id===id).name,'활성화됨',b);}}
 else{content.append(el('p',p.text||'WASD / 방향키: 이동 · E: 상호작용 · Space: 근접 공격 · F: 원거리 공격 · B: 자전거 · Q: 순무 먹기 · G: 등불 배치 · I: 창고 · M: 지도/기록 · P: 저장 · Esc: 닫기'));if(p.type==='help'){content.append(el('p','구리 8개와 돌 4개를 캐고 공방에서 채굴 기술 → 구리 곡괭이를 만드세요. 철을 캐면 강철 곡괭이로 성장할 수 있습니다. 사원 등불은 왼쪽 → 가운데 → 오른쪽. B2/B3의 장치 순서는 해당 층 안내석에 적혀 있습니다.'));content.append(el('p','기운을 잃으면 재료를 보존한 채 집 앞에서 회복합니다. 광맥은 24초 후 재생합니다. 패널을 연 동안 세계는 멈춥니다.'));content.append(el('p','독립 실험판입니다. 지리·수치·마을 배치는 임시이며 기존 게임 기능과 저장 호환성을 검증한 버전이 아닙니다.','hint'));}}
}
function hud(){const r=game.world.region,s=game.state;byId('region-name').textContent=r.name;byId('region-sub').textContent=r.sub;byId('region-tag').textContent=(game.world.underground?'UNDERGROUND':'SURFACE')+' / '+String(G.regions.indexOf(r)+1).padStart(2,'0');byId('health-fill').style.width=s.player.hp+'%';byId('health-value').textContent=Math.ceil(s.player.hp);byId('equipment').textContent=`곡괭이 ${'I'.repeat(s.pick)} · 채굴 Lv.${1+Math.floor(s.xp.mining/10)}${game.bike?' · 자전거':''}`;byId('quest').textContent=s.flags.lab?'연구실 복원 완료! 마을과 남은 기록을 탐험하세요.':s.xp.mining===0?'구리 광맥에서 첫 광물을 캐 보세요.':s.pick===1?'구리 8 · 돌 4 → 공방에서 곡괭이 강화':r.action;byId('quest-progress').textContent=`기록 ${s.records.length} / 11 · 방문 ${s.visited.length} / 11`;byId('toast').textContent=game.noticeTime>0?game.notice:'';const o=game.nearest();byId('prompt').textContent=game.riding?'[A/D] 수레 이동 · [E] 내리기':o?'[E] '+o.name:'';panel();}
const directions={KeyW:'up',ArrowUp:'up',KeyS:'down',ArrowDown:'down',KeyA:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right'};
window.addEventListener('keydown',e=>{if(e.target instanceof HTMLInputElement)return;if(directions[e.code]||['Space','KeyE'].includes(e.code))e.preventDefault();if(e.code==='Escape'){close();return;}if(game.panel)return;if(directions[e.code])held[directions[e.code]]=true;if(e.repeat)return;if(e.code==='KeyE'){game.interact();if(game.panel)clear();}if(e.code==='Space')game.attack(false);if(e.code==='KeyF')game.attack(true);if(e.code==='KeyB')game.toggleBike();if(e.code==='KeyQ')game.eat();if(e.code==='KeyG')game.decorate();if(e.code==='KeyI')open('inventory','공용 저장소');if(e.code==='KeyM')open('map','지도와 탐험 기록');if(e.code==='KeyP')save(true);});
window.addEventListener('keyup',e=>{if(directions[e.code])held[directions[e.code]]=false;});window.addEventListener('blur',clear);document.addEventListener('visibilitychange',()=>{clear();last=performance.now();});byId('close-panel').onclick=close;byId('inventory-button').onclick=()=>open('inventory','공용 저장소');byId('map-button').onclick=()=>open('map','지도와 탐험 기록');byId('help-button').onclick=()=>open('help','작은 세계의 첫걸음');byId('save-button').onclick=()=>save(true);window.addEventListener('resize',resize);window.addEventListener('pagehide',()=>save());resize();canvas.focus();
function frame(now){try{const dt=Math.min(.05,(now-last)/1000);last=now;game.step(dt,held);G.render(canvas,game,now/1000);hudTime+=dt;saveTime+=dt;if(hudTime>.08){hud();hudTime=0;}if(saveTime>10){save();saveTime=0;}requestAnimationFrame(frame);}catch(error){byId('fatal').hidden=false;byId('fatal').textContent='게임 실행 오류: '+error.message;console.error(error);}}
Object.defineProperty(window,'chaegul',{value:Object.freeze({snapshot:()=>game.snapshot(),version:G.VERSION})});requestAnimationFrame(frame);
})(globalThis.CG);
</script></body></html>
