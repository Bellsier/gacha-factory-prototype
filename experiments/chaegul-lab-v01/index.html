<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#182b27"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='50' font-size='50'%3E⚒%3C/text%3E%3C/svg%3E"><title>채굴 공방 · 작은 세계의 첫걸음</title><link rel="stylesheet" href="src/style.css"></head><body>
<header><div class="brand"><span class="brand-icon">⚒</span><strong>채굴 공방</strong><span class="edition">실험판 v0.1</span></div><div class="header-right"><span id="save-status">독립 저장</span><button id="save-button">저장</button><button id="help-button" aria-label="조작 안내">?</button></div></header>
<main id="stage"><canvas id="world" tabindex="0" aria-label="채굴 공방 게임 월드. WASD 이동, E 상호작용"></canvas>
<div class="region-card"><span class="eyebrow" id="region-tag">SURFACE / 01</span><h1 id="region-name">푸른 초원</h1><p id="region-sub">집으로 이어지는 길</p><div class="health"><span>♥</span><div><i id="health-fill"></i></div><b id="health-value">100</b></div><div class="equipment" id="equipment">곡괭이 I · 채굴 Lv.1</div></div>
<div class="quest-card"><span class="eyebrow">작은 발걸음</span><p id="quest">구리 광맥에서 첫 광물을 캐 보세요.</p><div id="quest-progress">기록 0 / 11</div></div>
<div id="minimap-wrap"><canvas id="minimap" width="168" height="126" aria-label="현재 지역 미니맵"></canvas><span>탐험 지도 <kbd>M</kbd></span></div><div id="toast" role="status"></div><div id="prompt"></div>
<div id="panel-backdrop" hidden><section id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title"><div class="panel-heading"><h2 id="panel-title"></h2><button id="close-panel" aria-label="닫기">×</button></div><div id="panel-content"></div></section></div><div id="fatal" hidden></div></main>
<footer><div class="keys"><span><kbd>WASD</kbd> 이동</span><span><kbd>E</kbd> 행동</span><span><kbd>Space</kbd> 검</span><span><kbd>F</kbd> 원거리</span><span><kbd>B</kbd> 자전거</span></div><nav><button id="inventory-button">창고 <kbd>I</kbd></button><button id="map-button">지도·기록 <kbd>M</kbd></button></nav></footer>
<script src="src/data.js"></script><script src="src/world.js"></script><script src="src/core.js"></script><script src="src/render.js"></script><script src="src/app.js"></script></body></html>
